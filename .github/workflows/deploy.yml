name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
          tags: ${{ secrets.DOCKER_USERNAME }}/my-portfolio:latest

      - name: Debug Secret Check
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            echo " ERROR: DISCORD_WEBHOOK is empty! Check your Repo Secrets."
            exit 1
          else
            echo "DISCORD_WEBHOOK is set."
          fi

      - name: Discord Notification
        if: always()
        # env:
        #  MSG: "GitHub Action Update..."
        run: |
          MSG="**GitHub Actions Update** **Project:** my-portfolio **Status:** ${{ job.status }} **Branch:** ${{ github.ref_name }} **Check it out here:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JSON_PAYLOAD=$(jq -n --arg msg "$MSG" '{content: $msg}')
          curl --fail -i -H "Content-Type: application/json" \
               -X POST \
               -d "$JSON_PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOKCER_HUB_URL }}

            sudo docker stop my-portfolio || true
            sudo docker rm my-portfolio || true

            sudo docker run -d -p 80:3000 --name my-portfolio ${{ secrets.DOCKER_HUB_URL }}

            sudo docker image prune -f
